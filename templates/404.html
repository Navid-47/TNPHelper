{% extends 'base.html' %}

{% block title %}Page Not Found — TNP Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="text-center animate-fade-up" style="max-width: 480px;">
        <div
            style="font-size: 6rem; font-weight: 800; color: var(--primary-600); line-height: 1; font-family: 'Plus Jakarta Sans', sans-serif;">
            404
        </div>
        <h2 class="fw-bold mt-3 mb-2">Page Not Found</h2>
        <p style="color: var(--slate-500); font-size: 1.05rem;" class="mb-4">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="{% url 'core:home' %}" class="btn btn-primary hover-lift">
                <i class="bi bi-house me-2"></i>Back to Home
            </a>
            <button onclick="history.back()" class="btn btn-light hover-lift">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
