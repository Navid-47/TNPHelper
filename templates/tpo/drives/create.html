{% extends 'dashboard_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Drive — TNP Portal{% endblock %}

{% block content %}
<nav class="breadcrumb-nav animate-fade-up">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'tpo:dashboard' %}"><i
                    class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'tpo:drives_list' %}">Drives</a></li>
        <li class="breadcrumb-item active">Create Drive</li>
    </ol>
</nav>
<div class="row justify-content-center animate-fade-up">
    <div class="col-lg-8">
        <div class="card border-0">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-plus-circle me-2 text-primary"></i>
                    Create Placement Drive
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary hover-lift">
                            <i class="bi bi-check-lg me-1"></i> Create Drive
                        </button>
                        <a href="{% url 'tpo:drives_list' %}" class="btn btn-light">
                            <i class="bi bi-arrow-left me-1"></i> Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
