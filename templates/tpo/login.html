{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}TPO Login - Resume Bank{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 animate-fade-up">
            <div class="card border-0 shadow-lg">
                <div class="card-header border-0 bg-white pb-0 pt-4">
                    <h3 class="mb-0 text-center fw-bold text-gradient">
                        <i class="fas fa-chart-line me-2 text-primary"></i>
                        TPO Login
                    </h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted text-center mb-4">
                        Access the Training & Placement Office dashboard.
                    </p>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Login
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">
                            <a href="{% url 'home' %}" class="text-decoration-none fw-bold text-muted">
                                <i class="fas fa-arrow-left me-2"></i>
                                Back to Home
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
