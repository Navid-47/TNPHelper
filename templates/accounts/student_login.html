{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Student Login — TNP Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-fade-up">
        <!-- Icon + Heading -->
        <div class="text-center mb-4">
            <div class="auth-icon-circle scale-hover">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p style="color: var(--slate-500);">Sign in to your student account</p>
        </div>

        <!-- Form -->
        <div class="card border-0 shadow-sm glass-panel">
            <div class="card-body p-4 auth-form">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg hover-lift">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer links -->
        <div class="text-center mt-3">
            <p style="color: var(--slate-500); font-size: 0.9rem;">
                Don't have an account?
                <a href="{% url 'accounts:student_register' %}" class="fw-600">Register here</a>
            </p>
            <a href="{% url 'accounts:tpo_login' %}" class="text-decoration-none small"
                style="color: var(--slate-400);">
                <i class="bi bi-shield-lock me-1"></i>TPO Admin Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
