{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Student Login - Resume Bank{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 animate-fade-up">
            <div class="card border-0 shadow-lg">
                <div class="card-header border-0 bg-white pb-0 pt-4">
                    <h3 class="mb-0 text-center fw-bold text-gradient">
                        <i class="fas fa-sign-in-alt me-2 text-primary"></i>
                        Student Login
                    </h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted text-center mb-4">
                        Welcome back! Please login to access your dashboard.
                    </p>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Login
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">
                            Don't have an account?
                            <a href="{% url 'students:register' %}" class="text-decoration-none fw-bold">
                                Register here
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
