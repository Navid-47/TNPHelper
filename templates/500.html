{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — TNP Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #0d9488;
            line-height: 1;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-primary {
            background: #0d9488;
            border-color: #0d9488;
            border-radius: 0.75rem;
            padding: 0.55rem 1.15rem;
        }

        .btn-primary:hover {
            background: #0f766e;
            border-color: #0f766e;
        }

        .btn-light {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.55rem 1.15rem;
        }
    </style>
</head>

<body>
    <div class="text-center" style="max-width: 480px; padding: 2rem;">
        <div class="error-code">500</div>
        <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; margin-top: 1rem;">Something Went
            Wrong</h2>
        <p style="color: #64748b; font-size: 1.05rem; margin-bottom: 1.5rem;">
            We're experiencing a server issue. Please try again in a few moments.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>Back to Home
            </a>
            <button onclick="location.reload()" class="btn btn-light">
                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </button>
        </div>
    </div>
</body>

</html>
